services:
  postgres:
    image: postgres:16
    container_name: ltt-craft-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: craft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in base_Platform/.env}
      POSTGRES_DB: ltt_craft
    ports:
      - "5434:5432"
    volumes:
      - ltt_craft_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craft -d ltt_craft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ltt_craft_pg_data:
